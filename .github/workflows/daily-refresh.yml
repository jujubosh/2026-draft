name: Daily data refresh

on:
  schedule:
    - cron: "30 11 * * *" # 7:30am ET during DST (8:30 winter)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Full pipeline: data pulls -> 300-sim Monte Carlo -> slot deep dive ->
      # intel/depth/ECR/history -> dashboard.html + index.html.
      # Intel fetchers are warn-and-continue; if a source blocks the runner,
      # the last committed data for that source keeps being used.
      - name: Run pipeline
        run: python refresh.py --sims 300

      - name: Commit & push if changed
        run: |
          git config user.name "draft-refresh-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Daily data refresh $(date -u +%F)"
            git push
          fi
